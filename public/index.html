<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grove — a skill tree from your own material</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2316a34a'/><path d='M16 23V12M16 12c0-3 2.6-5 5.5-5 0 3-2.5 5-5.5 5Zm0 3c0-3-2.6-5-5.5-5 0 3 2.5 5 5.5 5Z' stroke='white' stroke-width='1.8' stroke-linecap='round' fill='none'/></svg>" />
</head>
<body>

<!-- ═══════════════════════════════ SCREEN 1 — import ═════════════════════ -->
<button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"><svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>

<section id="screen-import" class="screen import-layout">
  <div class="import-inner">

    <button id="back-to-tree" class="back-link" hidden>← Back to map</button>

    <header class="hero">
      <span class="hero-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <path d="M16 27V13M16 13c0-4 3.2-6.6 7-6.6 0 4-3.1 6.6-7 6.6Zm0 4c0-4-3.2-6.6-7-6.6 0 4 3.1 6.6 7 6.6Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </span>
      <h1>Grove</h1>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="upload" role="tab" aria-selected="true" aria-controls="panel-upload">File</button>
      <button class="tab" data-tab="paste" role="tab" aria-selected="false" aria-controls="panel-paste">Notes</button>
      <button class="tab" data-tab="link" role="tab" aria-selected="false" aria-controls="panel-link">Link</button>
    </div>

    <div class="tab-panel" id="panel-upload" role="tabpanel" data-panel="upload">
      <div class="drop" id="drop">
        <p><strong>Drop a file</strong> or <button class="link" id="browse">browse</button></p>
        <input type="file" id="file-input" multiple hidden />
      </div>
    </div>

    <div class="tab-panel" id="panel-paste" role="tabpanel" data-panel="paste" hidden>
      <textarea id="paste" rows="7" placeholder="Paste your notes…"></textarea>
    </div>

    <div class="tab-panel" id="panel-link" role="tabpanel" data-panel="link" hidden>
      <input id="urls" type="text" placeholder="Paste a link" />
      <p class="hint center" id="link-hint"></p>
    </div>

    <button id="add-sources" class="btn primary block lg">Add</button>

    <ul id="source-list" class="sources"></ul>

    <button id="build" class="btn accent-solid block lg" disabled>Build skill tree</button>
    <p class="hint center" id="build-hint"></p>

    <button class="types-link" id="catalogue-toggle">Supports <span id="type-count">25</span> kinds of material</button>
  </div>
</section>

<!-- ═══════════════════════════════ SCREEN 2 — the tree ═══════════════════ -->
<section id="screen-tree" class="screen app-grid" hidden>

  <aside id="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <path d="M16 27V13M16 13c0-4 3.2-6.6 7-6.6 0 4-3.1 6.6-7 6.6Zm0 4c0-4-3.2-6.6-7-6.6 0 4 3.1 6.6 7 6.6Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </span>
      <h1>Grove</h1>
    </div>

    <button id="back-to-import" class="btn block">← Add material</button>

    <p class="hint" id="corpus-summary">—</p>

    <section class="panel" id="gap-panel" hidden>
      <h2>Gaps <span class="pill warn" id="gap-count">0</span></h2>
      <ul id="gap-list" class="gaps"></ul>
    </section>

    <section class="panel" id="srs-panel" hidden>
      <h2>Review due</h2>
      <ul id="srs-list" class="gaps"></ul>
    </section>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main id="main">
    <header id="topbar">
      <button id="sidebar-toggle" class="icon-btn only-narrow" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div id="crumbs"><span class="crumb current">No tree yet</span></div>
      <div class="grow"></div>
      <div id="progress-wrap" hidden>
        <div class="bar"><div id="progress-bar"></div></div>
        <span id="progress-label">0 / 0</span>
      </div>
      <button id="boss-btn" class="btn boss" hidden>Boss quiz</button>
    </header>

    <div id="stage">
      <svg id="tree" hidden></svg>
    </div>
  </main>
</section>

<!-- ------------------------------------------------------------- drawer -->
<section id="drawer" class="drawer" hidden>
  <button class="close" data-close-drawer aria-label="Close">×</button>
  <h2 id="drawer-title"></h2>
  <p id="drawer-summary" class="muted"></p>
  <div id="drawer-concepts" class="chips"></div>
  <div class="coverage">
    <div class="bar thin"><div id="cov-bar"></div></div>
    <span id="cov-label" class="hint"></span>
  </div>
  <div id="drawer-gap" class="gap-note" hidden></div>
  <div id="drawer-actions" class="drawer-actions"></div>
  <div id="drawer-sources"></div>
</section>

<!-- -------------------------------------------------------------- modal -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" id="modal-card"></div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="busy" class="busy" hidden>
  <div class="spinner"></div>
  <p id="busy-label">Working…</p>
  <button id="busy-escape" class="btn sm ghost" hidden>Cancel</button>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
