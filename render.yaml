# One-click deploy on Render: New > Blueprint > point at this repo.
services:
  - type: web
    name: grove
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_BIG_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_SMALL_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_API_KEY
        sync: false        # set this in the Render dashboard, never in the repo
      - key: NODE_VERSION
        value: "22"
